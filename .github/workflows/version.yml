name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  changesets:
    name: Create version pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update version pull request
        uses: changesets/action@v1
        with:
          version: npm run version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    name: Tag versioned release
    needs: changesets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create and push release tag if version changed
        id: tag
        run: bash scripts/tag-release.sh

  archive-release:
    name: Create archive branch from release tag
    needs: release-tag
    if: needs.release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create and verify archive branch
        run: bash scripts/archive-release.sh

  sync-beta:
    name: Fast-forward beta after main update
    needs: release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward beta to main
        run: |
          git fetch origin beta
          git merge-base --is-ancestor origin/beta HEAD
          git push origin HEAD:beta
