name: Deploy to GitHub Pages

# Only CI calls this workflow, after testing the artifact from this run.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name uploaded by the successful quality job, including its attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check main still points to the validated commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_commit" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA; main is $main_commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy validated artifact
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ inputs.artifact-name }}
          timeout: 480000
