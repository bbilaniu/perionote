version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Action v2 requires Changesets CLI v3; migrate them together separately.
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: [next, eslint-config-next]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
    ignore:
      # Keep the CLI compatible with the release action until a joint migration.
      - dependency-name: "@changesets/cli"
        update-types: [version-update:semver-major]
      # ignore-until: 2026-10-28
      - dependency-name: "@types/node"
        versions: ["^26.0.0"]
